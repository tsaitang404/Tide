# Versioned deployment: docker compose --env-file .env.production -f compose.production.yml up -d
services:
  backend:
    image: ${GENETICGRID_IMAGE:?Set GENETICGRID_IMAGE to a published version or digest}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a unique DJANGO_SECRET_KEY}
      TIDE_PUBLIC_READ_ONLY: ${TIDE_PUBLIC_READ_ONLY:-true}
      TIDE_HTTPS_PROXY: ${TIDE_HTTPS_PROXY:-false}
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://geneticgrid:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/geneticgrid
      USE_GUNICORN: "true"
      GUNICORN_WORKERS: "1"
      REALTIME_INGESTION_AUTO_START: ${REALTIME_INGESTION_AUTO_START:-false}
      REDIS_CACHE_ENABLED: "true"
      REDIS_CACHE_URL: redis://redis:6379/0
      DB_RETENTION_DAYS: ${DB_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/sources/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: geneticgrid
      POSTGRES_USER: geneticgrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geneticgrid -d geneticgrid"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
  redis-data:
